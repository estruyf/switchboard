# Builds Switchboard for a GitHub release.
#
# Runs when a release is published on GitHub (for a tag like v0.2.0): builds the app on an Apple
# Silicon runner, signs and notarises it, and attaches the .dmg to that release. The version comes
# from the tag. When the release has no notes, the matching CHANGELOG.md section is used.
#
# Nothing is ever attached unsigned: without the signing secrets the run fails.
# See docs/building-and-signing.md for the secrets.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  mac:
    name: Build, sign, notarise and attach the .dmg
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Version from the tag
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The release tag '$TAG' is not a version like v1.2.3."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run check

      - name: Build, sign and notarise
        env:
          # Developer ID Application certificate and its private key, exported as .p12 and base64-encoded.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # Notarisation with an app-specific password (electron-builder notarises when these are set).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Signing secrets are missing, and nothing is attached unsigned. See docs/building-and-signing.md."
            exit 1
          fi
          # The app's version (About panel, .dmg name) is the release's.
          npm pkg set version="$VERSION" -w @switchboard/desktop
          npm run dist

      - name: Check the signature and notarisation
        run: |
          app=apps/desktop/dist/mac-arm64/Switchboard.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl -a -vv "$app" 2>&1 | tee spctl.txt
          grep -q "source=Notarized Developer ID" spctl.txt

      - name: Attach the .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" apps/desktop/dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"

      - name: Fill in empty release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -n "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "The release has notes; leaving them."
            exit 0
          fi
          # This version's CHANGELOG section, without the link definitions.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION; the release notes stay empty."
          fi
